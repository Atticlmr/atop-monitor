name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-20.04
    strategy:
      matrix:
        include:
          - arch: x86_64
            name: amd64
          - arch: aarch64
            name: arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Clone FTXUI
        run: |
          rm -rf /tmp/FTXUI
          cd /tmp
          git clone --depth 1 --branch v6.1.9 https://github.com/ArthurSonzogni/FTXUI.git
          mkdir -p FTXUI/build
          cd FTXUI/build
          cmake .. -DFTXUI_BUILD_EXAMPLES=OFF -DFTXUI_BUILD_DOCS=OFF
          make -j$(nproc)

      - name: Configure CMake
        env:
          FTXUI_DIR: /tmp/FTXUI
        run: |
          rm -rf build
          mkdir -p build
          cd build
          cmake .. -DFTXUI_DIR=/tmp/FTXUI

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Create release asset
        run: |
          cd build
          cp atop-monitor atop-monitor-linux-${{ matrix.name }}
          strip atop-monitor-linux-${{ matrix.name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: build/atop-monitor-linux-${{ matrix.name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

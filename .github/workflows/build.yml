name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - arch: x86_64
            name: amd64
          - arch: aarch64
            name: arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Clone FTXUI
        run: |
          rm -rf /tmp/FTXUI
          cd /tmp
          git clone --depth 1 --branch v6.1.9 https://github.com/ArthurSonzogni/FTXUI.git
          mkdir -p FTXUI/build
          cd FTXUI/build
          cmake .. -DFTXUI_BUILD_EXAMPLES=OFF -DFTXUI_BUILD_DOCS=OFF
          make -j$(nproc)

      - name: Configure CMake
        env:
          FTXUI_DIR: /tmp/FTXUI
        run: |
          rm -rf build
          mkdir -p build
          cd build
          cmake .. -DFTXUI_DIR=/tmp/FTXUI

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Create release asset
        run: |
          cd build
          cp atop-monitor atop-monitor-linux-${{ matrix.name }}
          strip atop-monitor-linux-${{ matrix.name }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: build/atop-monitor-linux-${{ matrix.name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Tag: $TAG_NAME"
          
          gh release delete latest --yes 2>/dev/null || true
          
          cd build
          gh release create latest \
            --title "Latest (${TAG_NAME})" \
            --notes "Latest build from ${TAG_NAME}. Run: curl -sSL https://raw.githubusercontent.com/Atticlmr/atop-monitor/master/install.sh | bash" \
            --latest \
            atop-monitor-linux-amd64 \
            atop-monitor-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') == false
    runs-on: ubuntu-latest
    needs: build
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get latest tag
        id: get_tag
        run: |
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          else
            TAG=$(echo $TAG | awk -F. '{print $1"."$2"."$3+1}')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Creating new tag: $TAG"

      - name: Create tag
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/' + '${{ steps.get_tag.outputs.tag }}',
              sha: context.sha
            })

      - id: tag
        run: echo "tag=${{ steps.get_tag.outputs.tag }}" >> $GITHUB_OUTPUT
